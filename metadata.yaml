name: astrbot_plugin_student_assistant
desc: >-
  学院团学事务智能沟通小助手。学生自助问答由 AstrBot 原生知识库（RAG）完成，
  本插件补齐原生能力做不到的业务闭环：群聊与私聊均可自动收集知识库无法解答的学生提问，
  实时推送给订阅的负责人，解答后附带标准答案即可让机器人"学会"，下次相似问题自动参考回答；
  管理员可发送网页链接一键抓取入库；
  一条 /整理 指令即可让 AI 回溯群聊，提炼沟通摘要并自动登记待办；
  支持待办清单管理与面向老师/同学不同语气的同步播报。
version: 0.3.0
author: echosnow
repo: https://github.com/echosnow/astrbot_plugin_student_assistant
display_name: 团学事务智能助手
short_desc: 知识库问答闭环（未答收集+实时推送+解答学会）+ 链接入库 + 群聊整理摘要 + 待办清单与同步播报，私聊群聊均可用。
astrbot_version: ">=4.5.7,<5"
